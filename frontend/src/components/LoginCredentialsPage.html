<section class="login-credentials-page">
  <header class="header header-auth-row login-credentials-header">
    <div class="login-credentials-copy login-credentials-copy-with-context">
      <div>
        <h1>Anmeldeverfahren für Schulen</h1>
        <p>Verwaltung von Anmeldeverfahren GS und SEK I und den zugehoerigen Anmelderunden.</p>
      </div>

      <section
        class="login-credentials-context-card"
        :class="{ 'is-incomplete': hasSelectionAttentionContext }"
        aria-label="Aktueller Kontext"
      >
        <div class="login-credentials-context-row">
          <span class="login-credentials-context-label">Verfahren</span>
          <strong>{{ currentContext.verfahren }}</strong>
        </div>
        <div class="login-credentials-context-row">
          <span class="login-credentials-context-label">Runde</span>
          <span>{{ currentContext.runde }}</span>
        </div>
      </section>
    </div>

    <UserSessionCard
      :user="user"
      :user-label="userLabel || loginUserLabel"
      :connected-host="connectedHost"
      :connected-port="connectedPort"
      :connected-database="connectedDatabase"
      action-label="Logout"
      @action="emit('close')"
    />
  </header>

  <section class="card login-credentials-card-shell">
    <div class="login-credentials-main">
      <div class="login-credentials-menu" role="tablist" aria-label="Anmeldedaten Bereiche">
        <button
          type="button"
          class="login-credentials-menu-btn"
          :class="{ 'is-active': activeCredentialsMenu === 'verfahren' }"
          :aria-selected="activeCredentialsMenu === 'verfahren' ? 'true' : 'false'"
          @click="navigateToMenu('verfahren')"
        >
          Verfahren und Runden
        </button>
        <button
          type="button"
          class="login-credentials-menu-btn"
          :class="{ 'is-active': activeCredentialsMenu === 'verfahrensdaten' }"
          :aria-selected="activeCredentialsMenu === 'verfahrensdaten' ? 'true' : 'false'"
          :aria-disabled="!hasMenuSelectionContext ? 'true' : 'false'"
          :disabled="!hasMenuSelectionContext"
          @click="navigateToMenu('verfahrensdaten')"
        >
          Verfahrensdaten
        </button>
        <button
          type="button"
          class="login-credentials-menu-btn"
          :class="{ 'is-active': activeCredentialsMenu === 'abgleich' }"
          :aria-selected="activeCredentialsMenu === 'abgleich' ? 'true' : 'false'"
          :aria-disabled="!hasMenuSelectionContext ? 'true' : 'false'"
          :disabled="!hasMenuSelectionContext"
          @click="navigateToMenu('abgleich')"
        >
          Abgleich
        </button>
        <button
          type="button"
          class="login-credentials-menu-btn"
          :class="{ 'is-active': activeCredentialsMenu === 'koordination' }"
          :aria-selected="activeCredentialsMenu === 'koordination' ? 'true' : 'false'"
          :aria-disabled="!hasMenuSelectionContext ? 'true' : 'false'"
          :disabled="!hasMenuSelectionContext"
          @click="navigateToMenu('koordination')"
        >
          Koordination
        </button>
        <button
          type="button"
          class="login-credentials-menu-btn"
          :class="{ 'is-active': activeCredentialsMenu === 'offene-faelle' }"
          :aria-selected="activeCredentialsMenu === 'offene-faelle' ? 'true' : 'false'"
          :aria-disabled="!hasMenuSelectionContext ? 'true' : 'false'"
          :disabled="!hasMenuSelectionContext"
          @click="navigateToMenu('offene-faelle')"
        >
          Offene Faelle
        </button>
      </div>

      <AnmeldeverfahrenView
        v-if="hasMountedVerfahrenView"
        v-show="activeCredentialsMenu === 'verfahren'"
        :token="token"
        :verfahren-id="selectedVerfahrenId"
        :runde-id="selectedRundenId"
        @update-context="handleContextUpdate"
        @update-selection="handleSelectionUpdate"
      />

      <section
        v-if="activeCredentialsMenu === 'verfahrensdaten'"
        :key="selectedVerfahrenId ?? 'kein-verfahren'"
        class="login-credentials-stacked-panel"
        role="tabpanel"
      >
        <SchulenImVerfahrenBereich
          :token="token"
          :verfahren-id="selectedVerfahrenId"
          :verfahrenstyp="selectedVerfahrenstyp"
        />

        <ImporteView
          :token="token"
          :verfahren-id="selectedVerfahrenId"
          :runde-id="selectedRundenId"
          :verfahrenstyp="selectedVerfahrenstyp"
          :context="currentContext"
        />
      </section>

      <AbgleichView
        v-if="activeCredentialsMenu === 'abgleich'"
        :token="token"
        :verfahren-id="selectedVerfahrenId"
        :runde-id="selectedRundenId"
        :verfahrenstyp="selectedVerfahrenstyp"
        :context="currentContext"
      />

      <KoordinationView
        v-if="activeCredentialsMenu === 'koordination'"
        :token="token"
        :verfahren-id="selectedVerfahrenId"
        :runde-id="selectedRundenId"
        :runde-status="selectedRundenStatus"
        :context="currentContext"
      />

      <OffeneFaelleView
        v-if="activeCredentialsMenu === 'offene-faelle'"
        :token="token"
        :verfahren-id="selectedVerfahrenId"
        :runde-id="selectedRundenId"
        :context="currentContext"
      />
    </div>
  </section>
</section>
