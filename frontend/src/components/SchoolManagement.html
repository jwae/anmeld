<section class="school-management-page">
  <div v-if="!isManagementSessionActive" class="user-management-empty school-management-empty">
    <p>Fuer Daten laden, Aendern, Loeschen und Aktivieren bitte zuerst die Verwaltung laden.</p>
  </div>

  <template v-else>
    <section class="user-management-panel school-management-form-card">
      <div class="user-management-panel-head">
        <div class="school-management-form-title-block">
          <h3>{{ selectedManagementSchoolSourceId ? "Schule bearbeiten" : "Neue Schule hinzufuegen" }}</h3>
          <p>Die Verwaltung arbeitet hier direkt auf der Tabelle <code>anm_schulen</code>.</p>
        </div>
        <div class="school-management-form-actions">
          <button
            class="btn-secondary school-management-table-head-action school-management-help-button"
            type="button"
            @click="openHelpOverlay"
          >
            ? Hilfe
          </button>
          <button
            v-if="selectedManagementSchoolSourceId"
            class="btn-secondary"
            type="button"
            @click="resetSchoolSourceForm"
            :disabled="managementSaving"
          >
            Neue Schule
          </button>
        </div>
      </div>

      <input
        ref="schoolTableImportInput"
        type="file"
        accept=".csv,text/csv"
        class="school-management-import-input"
        @change="handleSchoolTableImportFileSelected"
      />

      <div class="user-management-form-grid school-management-form-grid">
        <label class="field-block">
          <span class="field-label">SNR</span>
          <input v-model="schoolSourceForm.snr" maxlength="6" :disabled="managementSaving" />
        </label>

        <label class="field-block">
          <span class="field-label">Name</span>
          <input v-model="schoolSourceForm.name" :disabled="managementSaving" />
        </label>

        <label class="field-block">
          <span class="field-label">PLZ</span>
          <input v-model="schoolSourceForm.plz" :disabled="managementSaving" />
        </label>

        <label class="field-block">
          <span class="field-label">Ort</span>
          <input v-model="schoolSourceForm.ort" :disabled="managementSaving" />
        </label>

        <label class="field-block">
          <span class="field-label">Strasse</span>
          <input v-model="schoolSourceForm.strasse" :disabled="managementSaving" />
        </label>

        <label class="field-block">
          <span class="field-label">Latitude</span>
          <input v-model="schoolSourceForm.latitude" inputmode="decimal" :disabled="managementSaving" />
        </label>

        <label class="field-block">
          <span class="field-label">Longitude</span>
          <input v-model="schoolSourceForm.longitude" inputmode="decimal" :disabled="managementSaving" />
        </label>
        <label class="field-block">
          <span class="field-label">Schulform (sf)</span>
          <input v-model="schoolSourceForm.sf_id" :disabled="managementSaving" />
        </label>

        <label class="field-block">
          <span class="field-label">db_host</span>
          <input v-model="schoolSourceForm.db_host" :disabled="managementSaving" />
        </label>

        <label class="field-block">
          <span class="field-label">db_name</span>
          <input v-model="schoolSourceForm.db_name" :disabled="managementSaving" />
        </label>

        <label class="field-block">
          <span class="field-label">db_user</span>
          <input v-model="schoolSourceForm.db_user" :disabled="managementSaving" />
        </label>

        <label class="field-block">
          <span class="field-label">db_password_enc</span>
          <input v-model="schoolSourceForm.db_password_enc" type="password" :disabled="managementSaving" />
        </label>
      </div>

      <label class="user-management-checkbox">
        <input v-model="schoolSourceForm.is_active" type="checkbox" :disabled="managementSaving" />
        <span>is_active</span>
      </label>

      <div class="user-management-inline-actions">
        <button class="btn-primary" type="button" @click="saveManagementSchoolSource" :disabled="managementSaving">
          {{ managementSaving ? "Speichere..." : (selectedManagementSchoolSourceId ? "Aenderungen speichern" : "Schule hinzufuegen") }}
        </button>
        <div class="school-management-inline-actions-right">
          <button
            class="btn-secondary school-management-import-info-button"
            type="button"
            @click="openImportInfoOverlay"
          >
            ? Info zum Import
          </button>
          <button
            class="btn-secondary"
            type="button"
            @click="openSchoolTableImportPicker"
            :disabled="managementSaving"
          >
            Schulen importieren
          </button>
          <button
            class="btn-secondary"
            type="button"
            @click="geocodeMissingManagementSchoolSources"
            :disabled="managementSaving || !managementSchoolSources.length"
          >
            Fehlende Koordinaten berechnen
          </button>
          <button
            class="btn-secondary school-management-import-info-button"
            type="button"
            @click="openGeocodeInfoOverlay"
          >
            ? Info Geocodes
          </button>
          <button
            class="btn-secondary school-management-delete-all"
            type="button"
            @click="deleteAllManagementSchools"
            :disabled="managementSaving || !managementSchoolSources.length"
          >
            Alle Schulen loeschen
          </button>
        </div>
      </div>

      <transition name="feedback-fade" mode="out-in">
        <div
          v-if="localFeedbackError"
          class="feedback-panel feedback-panel-error user-management-inline-feedback"
        >
          <p class="error">{{ localFeedbackError }}</p>
        </div>
        <div
          v-else-if="localFeedbackNotice"
          class="feedback-panel feedback-panel-success user-management-inline-feedback"
        >
          <p>{{ localFeedbackNotice }}</p>
        </div>
      </transition>
    </section>

    <section class="user-management-list-card school-management-table-card">
      <div class="user-management-panel-head">
        <div>
          <h3>Liste der Schulen</h3>
          <p>Anzeige der Eintraege aus <code>anm_schulen</code>.</p>
        </div>
      </div>

      <div class="school-management-table-wrap">
        <table class="school-management-table">
          <thead>
            <tr>
              <th>Nr.</th>
              <th><button class="school-management-sort" type="button" @click="toggleSort('snr')">SNR <span v-if="sortIndicatorBadge('snr')" class="school-management-sort-indicator">{{ sortIndicatorBadge("snr") }}</span></button></th>
              <th><button class="school-management-sort" type="button" @click="toggleSort('name')">Name <span v-if="sortIndicatorBadge('name')" class="school-management-sort-indicator">{{ sortIndicatorBadge("name") }}</span></button></th>
              <th><button class="school-management-sort" type="button" @click="toggleSort('plz')">PLZ <span v-if="sortIndicatorBadge('plz')" class="school-management-sort-indicator">{{ sortIndicatorBadge("plz") }}</span></button></th>
              <th><button class="school-management-sort" type="button" @click="toggleSort('ort')">Ort <span v-if="sortIndicatorBadge('ort')" class="school-management-sort-indicator">{{ sortIndicatorBadge("ort") }}</span></button></th>
              <th><button class="school-management-sort" type="button" @click="toggleSort('strasse')">Strasse <span v-if="sortIndicatorBadge('strasse')" class="school-management-sort-indicator">{{ sortIndicatorBadge("strasse") }}</span></button></th>
              <th><button class="school-management-sort" type="button" @click="toggleSort('school_form_sf')">SF <span v-if="sortIndicatorBadge('school_form_sf')" class="school-management-sort-indicator">{{ sortIndicatorBadge("school_form_sf") }}</span></button></th>
              <th><button class="school-management-sort" type="button" @click="toggleSort('db_host')">host <span v-if="sortIndicatorBadge('db_host')" class="school-management-sort-indicator">{{ sortIndicatorBadge("db_host") }}</span></button></th>
              <th><button class="school-management-sort" type="button" @click="toggleSort('db_name')">db_name <span v-if="sortIndicatorBadge('db_name')" class="school-management-sort-indicator">{{ sortIndicatorBadge("db_name") }}</span></button></th>
              <th><button class="school-management-sort" type="button" @click="toggleSort('db_user')">db_User <span v-if="sortIndicatorBadge('db_user')" class="school-management-sort-indicator">{{ sortIndicatorBadge("db_user") }}</span></button></th>
              <th><button class="school-management-sort" type="button" @click="toggleSort('db_password_enc')">PWD <span v-if="sortIndicatorBadge('db_password_enc')" class="school-management-sort-indicator">{{ sortIndicatorBadge("db_password_enc") }}</span></button></th>
              <th><button class="school-management-sort" type="button" @click="toggleSort('is_active')">Aktiv <span v-if="sortIndicatorBadge('is_active')" class="school-management-sort-indicator">{{ sortIndicatorBadge("is_active") }}</span></button></th>
              <th>Aktionen</th>
            </tr>
          </thead>
          <tbody>
            <tr
              v-for="(source, index) in sortedManagementSchoolSources"
              :key="`table-school-source-${source.snr}`"
              :class="{ 'school-management-row-active': source.is_active }"
            >
              <td>{{ index + 1 }}</td>
              <td>{{ source.snr }}</td>
              <td class="school-management-name">
                <span :title="source.name || source.school_name || 'Ohne Name'">
                  {{ formatSchoolSourceName(source.name || source.school_name) }}
                </span>
              </td>
              <td>{{ source.plz || "-" }}</td>
              <td>{{ source.ort || "-" }}</td>
              <td>{{ source.strasse || "-" }}</td>
              <td>{{ source.school_form_sf || "-" }}</td>
              <td>{{ source.db_host }}</td>
              <td>{{ source.db_name }}</td>
              <td>{{ source.db_user }}</td>
              <td :title="source.db_password_enc || '-'">{{ formatSchoolSourceName(source.db_password_enc) }}</td>
              <td>
                <span class="user-management-state" :class="{ 'is-inactive': !source.is_active }">
                  {{ source.is_active ? "Aktiv" : "Inaktiv" }}
                </span>
              </td>
              <td>
                <div class="school-management-actions">
                  <button
                    class="btn-secondary"
                    type="button"
                    @click="editManagementSchoolSource(source.snr)"
                    :disabled="managementSaving"
                    title="Schule aendern"
                    aria-label="Schule aendern"
                  >
                    <i class="bi bi-pencil-square" aria-hidden="true"></i>
                  </button>
                  <button
                    class="btn-secondary"
                    type="button"
                    @click="deleteManagementSchoolSource(source)"
                    :disabled="managementSaving"
                    title="Schule loeschen"
                    aria-label="Schule loeschen"
                  >
                    <i class="bi bi-trash" aria-hidden="true"></i>
                  </button>
                </div>
              </td>
            </tr>
            <tr v-if="!sortedManagementSchoolSources.length">
              <td colspan="13" class="school-management-table-empty">
                Noch keine Schulen in anm_schulen vorhanden.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <div
      v-if="schoolSelectionModalOpen"
      class="school-management-modal-overlay"
      @click.self="closeSchoolSelectionModal"
    >
      <section class="school-management-modal" role="dialog" aria-modal="true" aria-label="Schule auswaehlen">
        <div class="school-management-modal-head">
          <div>
            <h3>Schule auswaehlen</h3>
            <p>Filter auf SNR, Schulname und Ort. Auswahl mit Klick auf eine Zeile.</p>
          </div>
          <button class="btn-secondary" type="button" @click="closeSchoolSelectionModal">
            Schliessen
          </button>
        </div>

        <div class="school-management-modal-filters">
          <label class="field-block">
            <span class="field-label">SNR</span>
            <input v-model="schoolSelectionFilters.snr" type="text" placeholder="z. B. 123456" />
          </label>
          <label class="field-block">
            <span class="field-label">Name</span>
            <input v-model="schoolSelectionFilters.name" type="text" placeholder="Schulname filtern" />
          </label>
          <label class="field-block">
            <span class="field-label">Ort</span>
            <input v-model="schoolSelectionFilters.city" type="text" placeholder="Ort filtern" />
          </label>
        </div>

        <div class="school-management-modal-list school-management-modal-list-preview">
          <table v-if="filteredAvailableSchoolsForSource.length" class="school-management-modal-table">
            <thead>
              <tr>
                <th>SNR</th>
                <th>Schulname</th>
                <th>Ort</th>
              </tr>
            </thead>
            <tbody>
              <tr
                v-for="school in filteredAvailableSchoolsForSource"
                :key="`school-modal-option-${school.snr}`"
                class="school-management-modal-row"
                @click="selectSchoolForSource(school)"
              >
                <td>{{ school.snr }}</td>
                <td class="school-management-modal-school-name" :title="school.name || 'Ohne Name'">
                  {{ school.name || "Ohne Name" }}
                </td>
                <td>{{ school.city || "-" }}</td>
              </tr>
            </tbody>
          </table>
          <p v-else class="school-management-modal-empty">
            Keine passende Schule gefunden.
          </p>
        </div>
      </section>
    </div>

    <div
      v-if="schoolTableImportPreviewModalOpen"
      class="school-management-modal-overlay"
      @click.self="closeSchoolTableImportPreview"
    >
      <section class="school-management-modal school-management-school-import-preview-modal" role="dialog" aria-modal="true" aria-label="CSV-Vorschau Schulen">
        <div class="school-management-modal-head">
          <div>
            <h3>CSV-Vorschau (Schulen)</h3>
            <p>Die Datei <strong>{{ schoolTableImportFileName }}</strong> enthaelt {{ schoolTableImportSummary.total_rows }} gelesene Zeile(n).</p>
            <p>{{ schoolTableImportSummary.valid_rows }} gueltig, {{ schoolTableImportSummary.invalid_rows }} fehlerhaft, {{ schoolTableImportSummary.selected_rows }} ausgewaehlt.</p>
          </div>
          <button class="btn-secondary" type="button" @click="closeSchoolTableImportPreview" :disabled="managementSaving">
            Schliessen
          </button>
        </div>

        <div class="school-management-modal-list school-management-modal-list-preview">
          <transition name="feedback-fade" mode="out-in">
            <div
              v-if="localFeedbackError"
              class="feedback-panel feedback-panel-error school-management-modal-feedback"
            >
              <p class="error">{{ localFeedbackError }}</p>
            </div>
            <div
              v-else-if="localFeedbackNotice"
              class="feedback-panel feedback-panel-success school-management-modal-feedback"
            >
              <p>{{ localFeedbackNotice }}</p>
            </div>
          </transition>
          <table class="school-management-modal-table">
            <thead>
              <tr>
                <th>
                  <button
                    class="school-management-import-select-all"
                    type="button"
                    @click="selectAllSchoolTableImportRows"
                    :disabled="managementSaving"
                  >
                    Import
                  </button>
                </th>
                <th>Zeile</th>
                <th>Status</th>
                <th>Fehler</th>
                <th>SNR</th>
                <th>Name</th>
                <th>PLZ</th>
                <th>Ort</th>
                <th>Strasse</th>
                <th>SF</th>
                <th>SF-Code</th>
                <th>Host</th>
                <th>DB</th>
                <th>User</th>
                <th>Passwort</th>
                <th>Aktiv</th>
              </tr>
            </thead>
            <tbody>
              <tr
                v-for="row in schoolTableImportPreviewData"
                :key="`school-table-import-preview-${row.row_no}-${row.snr}`"
                class="school-management-modal-row school-management-import-preview-row"
                :class="{ 'is-invalid': row.status === 'Fehler' }"
              >
                <td>
                  <input v-model="row.selected" type="checkbox" :disabled="managementSaving || row.status === 'Fehler'" @change="refreshSchoolTableImportSelectionSummary" />
                </td>
                <td>{{ row.row_no }}</td>
                <td>
                  <span class="user-management-state" :class="row.status === 'Fehler' ? 'is-inactive' : (row.exists ? 'is-active' : 'is-inactive')">
                    {{ row.status }}
                  </span>
                </td>
                <td :title="Array.isArray(row.errors) ? row.errors.join(', ') : ''">
                  {{ Array.isArray(row.errors) && row.errors.length ? row.errors.join(", ") : "-" }}
                </td>
                <td>{{ row.snr || "-" }}</td>
                <td :title="row.name || '-'">{{ row.name || "-" }}</td>
                <td>{{ row.plz || "-" }}</td>
                <td>{{ row.ort || "-" }}</td>
                <td :title="row.strasse || '-'">{{ row.strasse || "-" }}</td>
                <td>{{ row.sf_code || "-" }}</td>
                <td>{{ row.sf_id || "-" }}</td>
                <td :title="row.db_host || '-'">{{ row.db_host || "-" }}</td>
                <td>{{ row.db_name || "-" }}</td>
                <td>{{ row.db_user || "-" }}</td>
                <td>{{ row.db_password_masked || "-" }}</td>
                <td>{{ Number(row.is_active) === 1 ? "Ja" : "Nein" }}</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="school-management-modal-actions">
          <button class="btn-secondary" type="button" @click="closeSchoolTableImportPreview" :disabled="managementSaving">
            Abbrechen
          </button>
          <button
            class="btn-primary"
            type="button"
            @click="confirmSchoolTableImport"
            :disabled="managementSaving || !schoolTableImportPreviewData.some((row) => row?.selected && row?.status !== 'Fehler')"
          >
            Import starten
          </button>
        </div>
      </section>
    </div>

    <div
      v-if="schoolImportPreviewModalOpen"
      class="school-management-modal-overlay"
      @click.self="cancelSchoolImport"
    >
      <section class="school-management-modal school-management-import-preview-modal" role="dialog" aria-modal="true" aria-label="CSV-Vorschau">
        <div class="school-management-modal-head">
          <div>
            <h3>Zugangsdaten für Schulserver importieren.</h3>
            <p>Es werden nur Zugangsdaten für schon vorhandene Schulen mit SNr. importiert.</p>
            <p>Die Datei <strong>{{ schoolImportFileName }}</strong> enthaelt {{ schoolImportPreviewData.length }} gueltige Zeile(n).</p>
          </div>
          <button class="btn-secondary" type="button" @click="cancelSchoolImport" :disabled="managementSaving">
            Schliessen
          </button>
        </div>

        <div class="school-management-import-preview-options">
          <label
            class="school-management-import-overwrite-toggle"
            :title="schoolImportOverwriteExisting
              ? 'Ein = Importiere alle Schulen mit Haekchen und ueberschreibe vorhandene'
              : 'Aus = Importiere nur neue Schulen mit Haekchen'"
          >
            <input
              v-model="schoolImportOverwriteExisting"
              type="checkbox"
              class="school-management-import-overwrite-toggle-input"
              :disabled="managementSaving"
            />
            <span class="school-management-import-overwrite-toggle-switch" aria-hidden="true"></span>
            <span class="school-management-import-overwrite-toggle-label">Daten ueberschreiben</span>
          </label>
        </div>

        <div class="school-management-modal-list">
          <transition name="feedback-fade" mode="out-in">
            <div
              v-if="localFeedbackError"
              class="feedback-panel feedback-panel-error school-management-modal-feedback"
            >
              <p class="error">{{ localFeedbackError }}</p>
            </div>
            <div
              v-else-if="localFeedbackNotice"
              class="feedback-panel feedback-panel-success school-management-modal-feedback"
            >
              <p>{{ localFeedbackNotice }}</p>
            </div>
          </transition>
          <table class="school-management-modal-table">
            <thead>
              <tr>
                <th>
                  <button
                    class="school-management-import-select-all"
                    type="button"
                    @click="selectAllSchoolImportRows"
                    :disabled="managementSaving"
                  >
                    Import
                  </button>
                </th>
                <th>SNR</th>
                <th>Schulname</th>
                <th>Host</th>
                <th>Datenbank</th>
                <th>User</th>
                <th>Vorhanden</th>
              </tr>
            </thead>
            <tbody>
              <tr
                v-for="row in schoolImportPreviewData"
                :key="`import-preview-${row.snr}`"
                class="school-management-modal-row school-management-import-preview-row"
              >
                <td>
                  <input v-model="row.selected" type="checkbox" :disabled="managementSaving" />
                </td>
                <td>{{ row.snr }}</td>
                <td :title="row.school_name || '-'">{{ formatImportPreviewSchoolName(row.school_name) }}</td>
                <td>{{ row.db_host || "-" }}</td>
                <td>{{ row.db_name || "-" }}</td>
                <td>{{ row.db_user || "-" }}</td>
                <td>
                  <span class="user-management-state" :class="row.exists ? 'is-active' : 'is-inactive'">
                    {{ row.exists ? 'Ja' : 'Neu' }}
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="school-management-modal-actions">
          <button class="btn-secondary" type="button" @click="cancelSchoolImport" :disabled="managementSaving">
            Abbrechen
          </button>
          <button
            class="btn-primary"
            type="button"
            @click="confirmSchoolImport"
            :disabled="managementSaving || !schoolImportPreviewData.some((row) => row?.selected)"
          >
            Import starten
          </button>
        </div>
      </section>
    </div>

    <HelpOverlay
      v-if="helpOverlayOpen"
      title="Hilfe zu Schulen"
      subtitle="Kurzer Ueberblick ueber die wichtigsten Funktionen."
      :items="helpOverlayItems"
      aria-label="Hilfe Schulen"
      @close="closeHelpOverlay"
    />

    <div
      v-if="importInfoOverlayOpen"
      class="school-management-modal-overlay"
      @click.self="closeImportInfoOverlay"
    >
      <section class="school-management-modal school-management-import-info-modal" role="dialog" aria-modal="true" aria-label="Info zum Import">
        <div class="school-management-modal-head">
          <div>
            <h3>Info zum Import</h3>
            <p>So muss die CSV-Datei fuer den Import in <code>anm_schulen</code> aufgebaut sein.</p>
          </div>
          <button class="btn-secondary" type="button" @click="closeImportInfoOverlay">
            Schliessen
          </button>
        </div>

        <div class="school-management-import-info-grid">
          <section class="school-management-import-info-card">
            <h4>CSV-Aufbau</h4>
            <div class="school-management-import-info-callout">
              <strong>Pflichtspalten</strong>
              <span>Die Kopfzeile muss genau diese Spalten enthalten:</span>
            </div>
            <pre class="school-management-import-info-code">snr;name;plz;ort;strasse;sf;db_host;db_name;db_user;db_password_enc;is_active</pre>
            <div class="school-management-import-info-list">              
              <p><strong>sf:</strong> Gibt die Schulform an, zum Beispiel <code>GS</code>, <code>GE</code> oder <code>GY</code>.</p>              
              <p><strong>Pruefung:</strong> Jede Zeile wird vor dem Import als <code>Neu</code>, <code>Aenderung</code>, <code>Unveraendert</code> oder <code>Fehler</code> bewertet.</p>
            </div>
          </section>

          <section class="school-management-import-info-card">
            <h4>Beispiel</h4>
            <pre class="school-management-import-info-code">snr;name;plz;ort;strasse;sf;db_host;db_name;db_user;db_password_enc;is_active
123456;Goethe-Gymnasium;50667;Koeln;Domkloster 4;GY;https://svws.example.de;svwsdb;svws_user;***;1</pre>
            
          </section>

        </div>

        <div class="school-management-import-info-note">
          <p>Als Trennzeichen werden `;` und `,` akzeptiert. Gross- und Kleinschreibung der Ueberschriften wird ignoriert. Leere oder ungueltige `sf`-Werte fuehren in der Vorschau zu einem Fehler.</p>
        </div>
      </section>
    </div>

    <div
      v-if="geocodeInfoOverlayOpen"
      class="school-management-modal-overlay"
      @click.self="closeGeocodeInfoOverlay"
    >
      <section class="school-management-modal school-management-import-info-modal" role="dialog" aria-modal="true" aria-label="Info zur Geocodes-Berechnung">
        <div class="school-management-modal-head">
          <div>
            <h3>Info zur Geocodes-Berechnung</h3>
            <p>So werden fehlende Koordinaten fuer Schulen ermittelt.</p>
          </div>
          <button class="btn-secondary" type="button" @click="closeGeocodeInfoOverlay">
            Schliessen
          </button>
        </div>

        <div class="school-management-import-info-grid">
          <section class="school-management-import-info-card">
            <h4>Berechnung</h4>
            <div class="school-management-import-info-list">
              <p>Verwendet werden die Felder <code>strasse</code>, <code>plz</code> und <code>ort</code> aus <code>anm_schulen</code>.</p>
              <p>Aus diesen Adressdaten wird eine Suchanfrage gebaut und an den Geocoding-Dienst von OpenRouteService gesendet.</p>
              <p>Wenn ein Treffer gefunden wird, werden die Werte als <code>latitude</code> und <code>longitude</code> gespeichert.</p>
              <p>Wenn Adresse oder Treffer fehlen, bleiben die Koordinaten leer.</p>
            </div>
          </section>

          <section class="school-management-import-info-card">
            <h4>Dienst</h4>
            <div class="school-management-import-info-list">
              <p>Die Anwendung nutzt das Geocoding von OpenRouteService.</p>
              <p>
                Dokumentation:
                <a href="https://openrouteservice.org/dev/#/api-docs/geocode/search/get" target="_blank" rel="noopener noreferrer">
                  OpenRouteService Geocoding
                </a>
              </p>
            </div>
          </section>
        </div>
      </section>
    </div>

    <div
      v-if="deleteAllSchoolsConfirmOpen"
      class="school-management-modal-overlay"
      @click.self="closeDeleteAllSchoolsConfirm"
    >
      <section class="school-management-modal school-management-danger-modal" role="dialog" aria-modal="true" aria-label="Alle Schulen loeschen">
        <div class="school-management-danger-hero">
          <div class="school-management-danger-badge" aria-hidden="true">!</div>
          <div>
            <h3>Alle Schulen wirklich loeschen?</h3>
            <p>Diese Aktion entfernt den kompletten Schulbestand aus der Verwaltung.</p>
          </div>
        </div>

        <div class="school-management-danger-summary">
          <strong>{{ managementSchoolSources.length }} Schule(n)</strong>
          <span>werden aus <code>anm_schulen</code> entfernt.</span>
        </div>

        <div class="school-management-danger-list">
          <p>Folgen dieser Aktion:</p>
          <ul>
            <li>Alle Eintraege aus `anm_schulen` werden geloescht.</li>
            <li>Die Tabellen `school` und `school_source_db` bleiben unberuehrt.</li>
            <li>Snapshots werden dabei nicht geloescht.</li>
          </ul>
        </div>

        <div class="school-management-modal-actions">
          <button class="btn-secondary" type="button" @click="closeDeleteAllSchoolsConfirm" :disabled="managementSaving">
            Abbrechen
          </button>
          <button class="btn-primary school-management-danger-button" type="button" @click="confirmDeleteAllManagementSchools" :disabled="managementSaving">
            {{ managementSaving ? "Loesche..." : "Endgueltig loeschen" }}
          </button>
        </div>
      </section>
    </div>

    <div
      v-if="importResultDialogOpen"
      class="school-management-modal-overlay"
      @click.self="closeImportResultDialog"
    >
      <section class="school-management-modal school-management-import-result-modal" role="dialog" aria-modal="true" :aria-label="importResultDialogTitle">
        <div class="school-management-modal-head">
          <div>
            <h3>{{ importResultDialogTitle }}</h3>
            <p>Ergebnis des CSV-Imports fuer den Bereich Schulen.</p>
          </div>
          <button class="btn-secondary" type="button" @click="closeImportResultDialog">
            Schliessen
          </button>
        </div>
        <pre class="school-management-import-result-body">{{ importResultDialogBody }}</pre>
      </section>
    </div>

    <div
      v-if="loadingOverlayOpen"
      class="school-management-loading-overlay"
      role="status"
      aria-live="polite"
      aria-modal="true"
    >
      <section class="school-management-loading-dialog" aria-label="Verbindungstest laeuft">
        <span class="school-management-loading-spinner" aria-hidden="true"></span>
        <strong>Bitte warten...</strong>
        <p>{{ currentActionLabel || "Vorgang laeuft..." }}</p>
        <p v-if="currentActionInfo" class="school-management-loading-info">{{ currentActionInfo }}</p>
        <a
          v-if="currentActionLink"
          class="school-management-loading-link"
          :href="currentActionLink"
          target="_blank"
          rel="noopener noreferrer"
        >
          {{ currentActionLinkLabel || currentActionLink }}
        </a>
      </section>
    </div>
  </template>
</section>
