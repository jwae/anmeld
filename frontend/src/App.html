<div class="page" :class="{ 'page-anm-route': isAnmRoute }">
  <template v-if="showAppManagement && pendingLogin && canPendingManageApp">
    <APPManagement
      :token="pendingLogin?.token || ''"
      :user="pendingLoginUser"
      :connected-host="connectedHost || host"
      :connected-port="connectedPort || port"
      :connected-database="connectedDatabase || database"
      :show-close-button="true"
      close-label="Logout"
      @close="logoutPendingManagementSession"
    />
  </template>

  <template v-else-if="!isAuthenticated">
    <section class="card login-card app-login-card">
      <div class="app-login-header">
        <div>
          <p class="eyebrow">{{ pendingLogin ? 'Anwendungsbereiche' : 'Anmeldung' }}</p>
          <h2>{{ pendingLogin ? 'Bereich auswählen' : 'Anmeldeverfahren für Schulen' }}</h2>
          <p class="app-login-intro">
            {{ pendingLogin ? 'Wähle den gewünschten Bereich.' : 'Melde dich mit deinem Benutzerkonto an.' }}
          </p>
        </div>
        <div v-if="pendingLogin" class="login-status-chip login-status-chip-success">
          <i class="bi bi-person-check"></i>
          <strong>{{ pendingLoginUserLabel }}</strong>
        </div>
      </div>

      <form v-if="!pendingLogin" class="login-form app-login-form" @submit.prevent="login">
        <fieldset class="login-inputs" :disabled="loginBusy">
          <div class="login-fields-row">
            <label class="field-block field-fixed-240">
              <span class="field-label">Benutzername</span>
              <input v-model="loginUsername" autocomplete="username" required />
            </label>
            <div class="password-settings-row">
              <label class="field-block field-fixed-240">
                <span class="field-label">Passwort</span>
                <input v-model="loginPassword" type="password" autocomplete="current-password" required />
              </label>
              <button
                class="btn-secondary connection-settings-toggle"
                type="button"
                :aria-expanded="showConnectionSettings"
                :aria-label="showConnectionSettings ? 'Einstellungen ausblenden' : 'Einstellungen anzeigen'"
                :title="showConnectionSettings ? 'Einstellungen ausblenden' : 'Einstellungen anzeigen'"
                aria-controls="login-connection-settings"
                @click="showConnectionSettings = !showConnectionSettings"
              >
                <i class="bi bi-gear" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <Transition name="settings-slide">
            <div v-if="showConnectionSettings" class="connection-settings-slide">
              <div class="connection-settings-clip">
                <div id="login-connection-settings" class="connection-settings">
                  <p>Verbindung zur Anwendungsdatenbank. Diese Zugangsdaten gehören zum Datenbankkonto.</p>
                  <div class="connection-settings-fields connection-server-fields">
                    <label class="field-block">
                      <span class="field-label">Server</span>
                      <input v-model="host" autocomplete="off" placeholder="z. B. localhost" required />
                    </label>
                    <label class="field-block">
                      <span class="field-label">Port</span>
                      <input v-model.number="port" type="number" min="1" max="65535" required />
                    </label>
                    <label class="field-block">
                      <span class="field-label">Datenbank</span>
                      <input v-model="database" autocomplete="off" required />
                    </label>
                    <button
                      class="btn-secondary db-test-button"
                      type="button"
                      title="Testet, ob die DB erreichbar ist."
                      :disabled="loginBusy"
                      @click="testConnection"
                    >{{ testing ? 'Teste...' : 'DB-Test' }}</button>
                  </div>
                  <div class="connection-settings-fields">
                    <label class="field-block">
                      <span class="field-label">DB-Benutzer</span>
                      <input v-model="dbUsername" autocomplete="off" required />
                    </label>
                    <label class="field-block">
                      <span class="field-label">DB-Passwort</span>
                      <input v-model="dbPassword" type="password" autocomplete="off" />
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </Transition>
        </fieldset>

        <div class="login-actions">
          <button class="btn-primary" :disabled="loginBusy" type="submit">
            {{ initializing ? 'Lade Verbindung...' : connecting ? 'Verbinde...' : loginLoading ? 'Anmelden...' : 'Anmelden' }}
          </button>
        </div>
        <div v-if="testSuccess && !error" class="feedback-panel feedback-panel-success" role="status">
          Die Datenbank ist erreichbar.
        </div>
        <div v-if="error" class="feedback-panel feedback-panel-error" role="alert">
          <p class="feedback-title">Verbindung fehlgeschlagen</p>
          <p class="error">{{ error }}</p>
          <p v-if="errorDetails">{{ errorDetails }}</p>
          <p v-if="errorCode">Code: {{ errorCode }}</p>
        </div>
      </form>

      <div v-else class="login-form app-login-form">
        <p v-if="!canPendingViewProcedures && !canPendingManageApp" role="status">
          Für dieses Konto ist kein Anwendungsbereich freigeschaltet.
        </p>
        <div class="login-actions">
          <button
            v-if="canPendingViewProcedures"
            class="btn-primary"
            type="button"
            :disabled="managementSessionLoading"
            @click="openAnmeldeverfahren"
          >Zum Anmeldeverfahren</button>
          <button
            v-if="canPendingManageApp"
            class="btn-secondary"
            type="button"
            :disabled="managementSessionLoading"
            @click="openAppManagement"
          >App-Verwaltung</button>
          <button
            class="btn-secondary"
            type="button"
            :disabled="managementSessionLoading"
            @click="logoutFromAreaSelection"
          ><i class="bi bi-power" aria-hidden="true"></i> Abmelden</button>
        </div>
      </div>

      <div v-if="loginError" class="feedback-panel feedback-panel-error login-error" role="alert">
        <p class="feedback-title">{{ pendingLogin ? 'Bereich konnte nicht geöffnet werden' : 'Anmeldung fehlgeschlagen' }}</p>
        <p class="error">{{ loginError }}</p>
      </div>
    </section>
    <section v-if="!pendingLogin" class="card app-structure-card" aria-labelledby="app-structure-title">
      <h3 id="app-structure-title">Struktur der App</h3>
      <img :src="appStructureImage" alt="Struktur der App" class="app-structure-image" />
    </section>
  </template>

  <template v-else-if="isAnmRoute && canViewProcedures">
    <LoginCredentialsPage
      :user-label="currentUserLabel"
      :connected-host="connectedHost || host"
      :connected-port="connectedPort || port"
      :connected-database="connectedDatabase || database"
      :token="authStore.token"
      @close="logout"
    />
  </template>
</div>
